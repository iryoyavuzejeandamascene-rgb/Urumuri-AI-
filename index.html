<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082b9b">

  <title>Urumuri AI</title>
  <style>
    :root {
      --navy: #071d72;
      --blue: #075be8;
      --purple: #5420c7;
      --gold: #ffd51a;
      --ink: #14235c;
      --soft: #f2f4ff;
      --shadow: 0 8px 22px rgba(0, 20, 90, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, rgba(255,255,255,.8), transparent 28%),
        linear-gradient(135deg, #80d7ff 0%, #e9f8ff 42%, #a8ed9c 100%);
    }
    button, select, textarea { font: inherit; }
    .page { width: min(1220px, 100%); margin: 0 auto; padding: 14px; }
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 190px;
      padding: 18px 24px;
      color: white;
      border: 3px solid white;
      border-radius: 26px;
      background: linear-gradient(115deg, #0879ec, #082b9b 58%, #0879ec);
      box-shadow: var(--shadow);
    }
    .brand-logo {
      width: 190px; height: 130px; object-fit: contain;
      border-radius: 14px; flex: 0 0 auto;
    }
    .brand { flex: 1; text-align: center; }
    .brand h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 4.8rem);
      line-height: 1;
      letter-spacing: 1px;
      font-weight: 900;
      text-shadow: 0 3px 4px #06134e;
    }
    .brand h1 span { color: var(--gold); }
    .tagline { margin: 10px 0 0; font-size: clamp(.95rem, 2.3vw, 1.35rem); font-weight: 700; font-style: italic; }
    .language-wrap { position: absolute; right: 16px; top: 14px; }
    .language-wrap select {
      color: white; background: rgba(0,0,70,.35); border: 1px solid white;
      border-radius: 30px; padding: 9px 12px; max-width: 145px;
    }
    .welcome {
      text-align: center; margin: 18px 0;
      padding: 15px; color: white; border-radius: 22px;
      background: linear-gradient(90deg, #092b9c, #175ee8, #092b9c);
      box-shadow: var(--shadow);
    }
    .welcome h2 { margin: 0 0 5px; font-size: clamp(1.5rem, 4vw, 2.5rem); }
    .welcome p { margin: 0; color: var(--gold); font-size: clamp(1rem, 2.5vw, 1.4rem); font-weight: 800; font-style: italic; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0; }
    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 150px; padding: 15px 10px; border: 3px solid white;
      border-radius: 22px; color: white; text-align: center; box-shadow: var(--shadow);
    }
    .card.education { background: linear-gradient(135deg, #058cf4, #082fba); }
    .card.business { background: linear-gradient(135deg, #65d900, #087b27); }
    .card.health { background: linear-gradient(135deg, #ff5555, #bd001d); }
    .card .icon { font-size: 2.6rem; line-height: 1.1; }
    .card h3 { margin: 8px 0 4px; font-size: clamp(1rem, 2.4vw, 1.45rem); }
    .card p { margin: 0; font-weight: 700; }
    .chat-shell {
      padding: 14px; border: 4px solid white; border-radius: 28px;
      background: rgba(255,255,255,.96); box-shadow: var(--shadow);
    }
    .chat-title {
      margin: 0 0 14px; padding: 12px 18px; color: white;
      border-radius: 18px; font-size: clamp(1.35rem, 3.5vw, 2rem);
      background: linear-gradient(90deg, #4b12bd, #1268ee);
    }
    .chat-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    label { display: block; margin: 8px 0; font-weight: 800; font-size: 1.05rem; }
    .field {
      width: 100%; padding: 13px; border: 2px solid #aaa6ed;
      border-radius: 14px; color: #19245a; background: white;
    }
    textarea.field { min-height: 112px; resize: vertical; line-height: 1.45; }
    .send-btn {
      width: 100%; margin-top: 12px; padding: 15px;
      border: 0; border-radius: 16px; color: white; cursor: pointer;
      font-size: 1.35rem; font-weight: 900;
      background: linear-gradient(90deg, #0878ed, #2314dc);
      box-shadow: 0 5px 12px rgba(0,45,170,.22);
    }
    .send-btn:disabled { opacity: .65; cursor: wait; }
    .result-panel {
      min-height: 245px; padding: 18px; border: 2px solid #c3bafa;
      border-radius: 22px; background: linear-gradient(145deg, #f3efff, #e4eaff);
    }
    .result-heading { margin: 0 0 12px; font-size: 1.15rem; color: #142c8a; }
    #answer {
      white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6;
      min-height: 150px; color: #18265e;
    }
    .status { margin-top: 10px; font-size: .9rem; color: #47527f; }
    .note {
      margin: 12px 0 0; padding: 12px; border-radius: 14px;
      background: #e9edff; color: #1a2b70; font-size: .9rem; line-height: 1.5;
    }
    footer {
      margin-top: 16px; padding: 18px 10px; text-align: center;
      color: #ffeb36; background: #071d72; border-radius: 18px;
      font-weight: 800; font-size: clamp(1rem, 2.8vw, 1.4rem);
    }
    @media (max-width: 760px) {
      .page { padding: 9px; }
